@if (isAuthPage()) {
  <router-outlet />
} @else {
  <div class="shell" [class.nav-open]="navOpen()">
    <app-sidebar class="sidebar" (navigate)="navOpen.set(false)" />
    <div class="scrim" (click)="navOpen.set(false)"></div>
    <div class="main">
      <app-header [page]="page()" (toggleNav)="navOpen.set(!navOpen())" />
      <main class="content">
        <router-outlet />
      </main>
    </div>
  </div>
}

<app-statusbar />
<app-toasts />
