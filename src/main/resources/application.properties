spring.application.name=multicloudstorageapi
# Load local secrets (gitignored). Env vars with the same names also work.
spring.config.import=optional:file:./secrets.properties
jwt.secret=infosysinternscloudstorage
#jwt.secret=BASE64_ENCODED_SECRET
# Local MySQL (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD)
# Old remote server: jdbc:mysql://20.204.218.104:3306/multicloud_database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/multicloud_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.sql.init.platform=mysql
server.port=8080
server.servlet.context-path=/multicloudstorageapi
spring.jpa.properties.hibernate.current_session_context_class=thread
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
security.basic.enabled=false
management.security.enabled=false

# Google Drive OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/multicloudstorageapi/oauth/google/callback
spring.security.oauth2.client.registration.google.scope=https://www.googleapis.com/auth/drive
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
google.credentials.path=classpath:google_credentials.json

# OneDrive OAuth2 Configuration
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.redirect-uri=http://localhost:8080/multicloudstorageapi/oauth/onedrive/callback
spring.security.oauth2.client.registration.microsoft.scope=Files.ReadWrite.All
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/v1.0/me
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
microsoft.tenant-id=f8cdef31-a31e-4b4a-93e4-5f571e91255a
